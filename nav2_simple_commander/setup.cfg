[develop]
# Install development scripts into the ROS package lib directory.
# 中文注解：开发模式下把脚本安装到 ROS 包的 lib 目录。
script_dir=$base/lib/nav2_simple_commander
[install]
# Install console scripts into the same ROS package lib directory.
# 中文注解：安装模式下 console script 也放到该包的 lib 目录。
install_scripts=$base/lib/nav2_simple_commander
