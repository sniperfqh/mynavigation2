# MPPI parameter reference. These defaults now live directly in myworld2.yaml.
# entry.launch.py does not read or merge this partial parameter file.
regulated_navigator:
  ros__parameters:
    controller_id: MPPI

controller_server:
  ros__parameters:
    controller_frequency: 100.0
    MPPI:
      model_dt: 0.01
      time_steps: 150
      batch_size: 500
      iteration_count: 1
      vx_max: 1.5
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      vx_std: 0.4
      vy_std: 0.0
      wz_std: 0.4
      prune_distance: 3.0
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
